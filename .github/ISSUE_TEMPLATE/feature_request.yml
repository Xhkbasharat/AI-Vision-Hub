
name: 💡 Feature Request
description: Suggest a new feature or improvement for AI Vision Hub.
title: "[FEATURE]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve AI Vision Hub!
        Describe your idea clearly so it can be evaluated.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area would this feature improve?
      options:
        - Computer Vision
        - Face Recognition
        - Object Detection
        - Image Classification
        - Machine Learning
        - Natural Language Processing
        - Sentiment Analysis
        - Fake News Detection
        - AI Chatbot
        - Dashboard and UI
        - Database and Storage
        - Security and Privacy
        - Deployment and Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem would this feature solve?
      placeholder: Explain the problem or opportunity.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you think the feature should work.
      placeholder: Explain your proposed implementation or behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches?
      placeholder: Describe alternative solutions, if any.

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add examples, references, mockups, or technical details.
      placeholder: Any additional information that might help.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission Checklist
      options:
        - label: I have searched existing issues for similar requests.
          required: true
        - label: This feature aligns with the goals of AI Vision Hub.
          required: true
