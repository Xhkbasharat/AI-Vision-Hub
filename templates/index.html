
<section class="tool-card" id="ml-prediction">
    <div class="tool-header">
        <div>
            <span class="tool-tag">MACHINE LEARNING</span>
            <h2>Iris Flower Prediction</h2>
            <p>Classify a flower using four measurements.</p>
        </div>
    </div>

    <form id="mlPredictionForm" class="tool-form">
        <div class="form-grid">
            <div class="form-group">
                <label for="sepalLength">Sepal length (cm)</label>
                <input
                    type="number"
                    id="sepalLength"
                    name="sepal_length"
                    min="0.1"
                    max="10"
                    step="0.1"
                    placeholder="Example: 5.1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="sepalWidth">Sepal width (cm)</label>
                <input
                    type="number"
                    id="sepalWidth"
                    name="sepal_width"
                    min="0.1"
                    max="10"
                    step="0.1"
                    placeholder="Example: 3.5"
                    required
                >
            </div>

            <div class="form-group">
                <label for="petalLength">Petal length (cm)</label>
                <input
                    type="number"
                    id="petalLength"
                    name="petal_length"
                    min="0.1"
                    max="10"
                    step="0.1"
                    placeholder="Example: 1.4"
                    required
                >
            </div>

            <div class="form-group">
                <label for="petalWidth">Petal width (cm)</label>
                <input
                    type="number"
                    id="petalWidth"
                    name="petal_width"
                    min="0.1"
                    max="10"
                    step="0.1"
                    placeholder="Example: 0.2"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="mlModel">Choose ML algorithm</label>
            <select id="mlModel" name="model">
                <option value="random_forest">Random Forest</option>
                <option value="xgboost">XGBoost</option>
            </select>
        </div>

        <button type="submit" class="primary-button">
            Predict Flower
        </button>
    </form>

    <div id="mlPredictionResult" class="result-box" aria-live="polite">
        Your prediction will appear here.
    </div>
</section>
