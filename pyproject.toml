
# ==========================================
# AI VISION HUB - PROJECT CONFIGURATION
# ==========================================

[project]
name = "ai-vision-hub"
version = "1.0.0"
description = "An integrated AI and machine learning platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

keywords = [
    "artificial-intelligence",
    "computer-vision",
    "machine-learning",
    "deep-learning",
    "natural-language-processing",
    "flask",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

# ==========================================
# RUFF CONFIGURATION
# ==========================================

[tool.ruff]

line-length = 88
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "models",
    "data",
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==========================================
# PYTEST CONFIGURATION
# ==========================================

[tool.pytest.ini_options]

testpaths = [
    ".",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
    "--strict-markers",
]

# ==========================================
# COVERAGE CONFIGURATION
# ==========================================

[tool.coverage.run]

branch = true

source = [
    "modules",
]

omit = [
    "*/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]

show_missing = true
skip_covered = true
fail_under = 0
