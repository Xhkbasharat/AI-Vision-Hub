
# ==========================================
# AI VISION HUB - DOCKER COMPOSE
# ==========================================

services:

  ai-vision-hub:

    container_name: ai-vision-hub

    build:
      context: .
      dockerfile: Dockerfile

    image: ai-vision-hub:latest

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env file}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "5000"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ai_vision_data:/app/data
      - ai_vision_models:/app/models
      - ai_vision_logs:/app/logs

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# ==========================================
# PERSISTENT STORAGE
# ==========================================

volumes:

  ai_vision_data:
    name: ai_vision_hub_data

  ai_vision_models:
    name: ai_vision_hub_models

  ai_vision_logs:
    name: ai_vision_hub_logs
